<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Musicola</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=23">
</head>
<body>
  <header>
    <h1>Musicola</h1>
    <form id="search-form" autocomplete="off">
      <input id="q" type="search" placeholder="Buscar canción, artista…" enterkeyhint="search">
    </form>
  </header>
  <div class="modes" role="radiogroup" aria-label="Tipo de búsqueda">
    <button data-mode="songs" class="chip on" role="radio">Canciones</button>
    <button data-mode="videos" class="chip" role="radio">Vídeos</button>
  </div>

  <nav class="tabs">
    <button data-tab="results" class="active">Resultados</button>
    <button data-tab="queue">Cola <span id="queue-count"></span></button>
    <button data-tab="favs">Favoritos</button>
    <button data-tab="lists">Listas <span id="lists-count"></span></button>
  </nav>

  <main>
    <ul id="results" class="list"></ul>
    <div id="queue-bar" class="list-bar hidden">
      <button id="btn-clear-queue" class="text-btn">Vaciar cola</button>
    </div>
    <ul id="queue" class="list hidden"></ul>
    <ul id="favs" class="list hidden"></ul>
    <section id="lists" class="hidden">
      <div id="pl-index">
        <div class="list-bar"><button id="pl-new" class="text-btn accent">+ Nueva lista</button></div>
        <ul id="pl-list" class="list"></ul>
        <p id="pl-none" class="status">Aún no tienes listas. Crea una aquí o usa ⋮ → «Añadir a una lista…» en cualquier canción.</p>
      </div>
      <div id="pl-detail" class="hidden">
        <div class="pl-head">
          <button id="pl-back" class="icon small" title="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.830l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
          <div class="pl-title"><div id="pl-name"></div><div id="pl-count"></div></div>
          <button id="pl-shuffle" class="icon small" title="Aleatorio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17L5.41 4 4 5.41l5.170 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
          <button id="pl-play" class="icon small" title="Reproducir todo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="pl-share" class="icon small" title="Compartir lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></button>
          <button id="pl-rename" class="icon small" title="Renombrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
          <button id="pl-delete" class="icon small" title="Eliminar lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
        </div>
        <ul id="pl-tracks" class="list"></ul>
        <p id="pl-empty" class="status">Lista vacía. Añade canciones con ⋮ → «Añadir a una lista…».</p>
      </div>
    </section>
    <p id="status" class="status"></p>
  </main>

  <footer id="player">
    <div class="now">
      <img id="np-thumb" alt="">
      <div class="np-text">
        <div id="np-title">Nada sonando</div>
        <div id="np-channel"></div>
      </div>
      <div class="volume">
        <button id="btn-mute" class="icon small" title="Silenciar (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
        <input id="volume" type="range" min="0" max="100" step="1" value="100" title="Volumen (↑ / ↓)" aria-label="Volumen">
      </div>
      <button id="btn-addlist" class="icon small" title="Añadir a una lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"/></svg></button>
      <button id="btn-share" class="icon small" title="Compartir canción"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></button>
      <button id="btn-fav" class="icon" title="Favorito"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg></button>
    </div>
    <div class="seek">
      <span id="t-cur">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="1" value="0">
      <span id="t-dur">0:00</span>
    </div>
    <div class="controls">
      <button id="btn-shuffle" class="icon small" title="Aleatorio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button id="btn-prev" class="icon" title="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button id="btn-play" class="icon big" title="Reproducir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="btn-next" class="icon" title="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="btn-repeat" class="icon small" title="Repetir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      <button id="btn-radio" class="icon small radio" title="Modo radio: añade canciones parecidas al acabar la cola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.89 2 2 2h16c1.11 0 2-.9 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z"/></svg></button>
    </div>
  </footer>

  <div id="menu" class="menu hidden" role="menu"></div>
  <div id="sheet" class="sheet hidden"><div id="sheet-body" class="sheet-body" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status"></div>

  <audio id="audio" preload="auto"></audio>
  <script src="/app.js?v=23"></script>
</body>
</html>
