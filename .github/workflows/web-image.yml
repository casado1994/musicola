name: Imagen Docker de la web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64 para Oracle Cloud (Ampere) y amd64 para PCs normales
      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/casado1994/musicola-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
