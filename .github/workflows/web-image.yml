name: Imagen Docker de la web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64 para Oracle Cloud (Ampere) y amd64 para PCs normales
      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/casado1994/musicola-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Comprueba que la imagen arranca y que el generador de tokens responde
  smoke-test:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Arrancar la imagen y consultar /healthz
        run: |
          docker run -d --name m -p 8000:8000 ghcr.io/casado1994/musicola-web:latest
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 2; done
          echo
          curl -fsS localhost:8000/healthz | tee h.json
          grep -q '"generador_tokens":true' h.json || { docker logs m; exit 1; }
