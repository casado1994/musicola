name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write # para publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk musicola.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: musicola-apk
          path: musicola.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Musicola ${{ github.run_number }}
          make_latest: true
          files: musicola.apk
          body: Descarga `musicola.apk` desde el móvil e instálalo.
